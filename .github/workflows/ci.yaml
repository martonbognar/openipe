name: CI
on:
  push:
  # run on manual trigger
  workflow_dispatch:
  pull_request:
  # trigger a cron job every monday at 8am
  schedule:
    - cron: "00 08 * * MON"

jobs:
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: "Dockerfile"
          tags: openipe:latest
          push: false
          outputs: type=docker,dest=/tmp/openipe-docker.tar

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v6
        with:
          name: openipe-docker
          path: /tmp/openipe-docker.tar

  ci-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: regression-tests
            cmd: cd /openipe/core/sim/rtl_sim/run/ && ./run_all
          - name: isolation-tests
            cmd: cd /openipe/core/sim/rtl_sim/run/ && ./run_ipe
          - name: symbolic-ipe
            cmd: ./scripts/symbolic_ipe.sh
          - name: symbolic-firmware
            cmd: ./scripts/symbolic_firmware.sh
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download Docker artifact
        uses: actions/download-artifact@v8
        with:
          name: openipe-docker
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/openipe-docker.tar

      - name: ${{ matrix.name }}
        uses: addnab/docker-run-action@v3
        with:
          image: openipe:latest
          options: -v ${{ github.workspace }}/core:/openipe/core
          run: ${{ matrix.cmd }}

  generate-verilator-matrix:
    name: Generate Verilator test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Discover ipe-* programs
        id: set-matrix
        run: |
          programs=$(ls -d core/sim/rtl_sim/src-c/ipe-*/ 2>/dev/null \
            | xargs -n1 basename \
            | jq -R . | jq -cs .)
          echo "matrix={\"program\":$programs}" >> "$GITHUB_OUTPUT"

  verilator-tests:
    name: verilator/${{ matrix.program }}
    runs-on: ubuntu-latest
    needs: [build-docker, generate-verilator-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-verilator-matrix.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download Docker artifact
        uses: actions/download-artifact@v8
        with:
          name: openipe-docker
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/openipe-docker.tar

      - name: Simulate ${{ matrix.program }}
        uses: addnab/docker-run-action@v3
        with:
          image: openipe:latest
          options: -v ${{ github.workspace }}/core:/openipe/core
          run: |
            set -e
            SIM_DIR=/openipe/core/sim/verilator
            SRC_C=/openipe/core/sim/rtl_sim/src-c
            PROG=${{ matrix.program }}
            make -C "$SIM_DIR"
            (cd "$SRC_C/$PROG" && make clean && make)
            output=$("$SIM_DIR/build/ipe-sim" --firmware "$SIM_DIR/build/bootcode.elf" "$SRC_C/$PROG/$PROG.elf" 2>&1)
            ret=$?
            echo "$output"
            if [ "$ret" -ne 0 ] || echo "$output" | grep -q "^FAIL"; then exit 1; fi

  push-image:
    name: Push Docker image
    runs-on: ubuntu-latest
    # only run when build and all tests succeed
    needs: [build-docker, ci-tests, verilator-tests]
    steps:
      - name: Download Docker artifact
        uses: actions/download-artifact@v8
        with:
          name: openipe-docker
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/openipe-docker.tar

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag openipe:latest ghcr.io/${{ github.repository_owner }}/openipe:latest
          docker push ghcr.io/${{ github.repository_owner }}/openipe:latest

  check-docker-compose:
    name: Check Docker Compose file
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run a simple test inside the container
        run: docker compose run openipe bash -c "cd /openipe/core/sim/rtl_sim/run/ && ./run_c ipe-hello"
